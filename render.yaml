services:
  - type: web
    name: icl-app
    runtime: node
    plan: free
    buildCommand: npm install && npm run build -w client
    startCommand: npm start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      # Same origin as the app itself, e.g. https://icl-app.onrender.com
      - key: CLIENT_URL
        sync: false
      - key: PUBLIC_API_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: XAI_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: CRICHEROES_SYNC_ENABLED
        value: "false"
      - key: CRICHEROES_SYNC_CRON
        value: "0 */6 * * *"
